<div>
  <div style="font-size: 11px; font-weight: 700; color: var(--accent-cyan); margin-bottom: 4px;">
    Q: {{ question }}
  </div>
  <div style="font-size: 13px; color: var(--text-primary); border-left: 2px solid var(--accent-indigo); padding-left: 10px;">
    {{ answer_html | safe }}
  </div>
  <div style="font-size: 10px; color: var(--text-muted); margin-top: 8px; text-align: right;">
    Matched Pattern: <code>{{ response.matched_pattern }}</code>
  </div>
</div>
